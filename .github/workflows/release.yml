# Two-stage release (2026-10-26, VPN only): this workflow BUILDS ONLY.
# It uploads the signed APK + checksum as a workflow artifact and
# creates NO release — so no update appears in the app yet. After
# VirusTotal + the Play Protect appeal for that exact APK, the publish
# workflow (.github/workflows/publish.yml) creates the published
# release from this run's artifact. Scanner is untouched by this change.
name: Build Release APK

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'ဖီးနစ် VPN v1.0 (Phone Release)'
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-release:
    name: Build Phone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare Keystore for Signing
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > phoenix-release.jks
          echo "Keystore decoded at $(pwd)/phoenix-release.jks"

      - name: Inject google-services.json (Firebase)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is not set" >&2
            exit 1
          fi
          # Secret holds base64 (single-line, shell-safe) of google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          echo "google-services.json injected"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/phoenix-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts

          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$APP_VERSION" ]; then
            echo "Error: could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "App version: $APP_VERSION"

          VERSION="${{ github.event.inputs.release_tag }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              VERSION="${GITHUB_REF#refs/tags/}"
            else
              VERSION="v${APP_VERSION}-$(date +'%Y%m%d%H%M')"
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # Two-stage: the tag + version ride with the artifact so the
          # publish workflow uses this exact build's tag — the APK in
          # the release is byte-identical to the one VirusTotal scanned
          # and the appeal cited. This file is NOT a release asset
          # (publish uploads *.apk + *.sha256 only).
          echo "TAG=$VERSION" > release-artifacts/release-meta.txt
          echo "APP_VERSION=$APP_VERSION" >> release-artifacts/release-meta.txt

          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Error: release APK not found at $APK_SRC" >&2
            exit 1
          fi
          APK_NAME="PhoenixVPN-v${APP_VERSION}.apk"
          cp "$APK_SRC" "release-artifacts/$APK_NAME"
          echo "APK: $(du -h "release-artifacts/$APK_NAME" | cut -f1)"

          cd release-artifacts
          sha256sum "$APK_NAME" > "${APK_NAME%.apk}-checksum.sha256"
          cd ..
          ls -lh release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-vpn-release
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

