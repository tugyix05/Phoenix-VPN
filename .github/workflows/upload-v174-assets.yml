name: Upload v1.74 assets (one-off)

# One-off 2026-11-18: the v1.74 build was dispatched without the
# release_tag input, so its artifact's release-meta.txt says TAG=v1.0.0
# while the APK itself (SHA-256 371e4162, the exact file VirusTotal
# scanned 0/67 and the Play Protect appeal cited) is correct. The
# release v1.74-202611180554 was created manually with that APK.
# This workflow uploads that exact artifact's APK + checksum to the
# existing release. Delete this file after it succeeds.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  upload:
    name: Upload APK + checksum to v1.74 release
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: phoenix-vpn-release
          run-id: 44247144802
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifacts

      - name: Upload assets to existing release
        run: |
          ls -lh release-artifacts/
          sha256sum release-artifacts/PhoenixVPN-v1.74.apk
          gh release upload v1.74-202611180554 release-artifacts/PhoenixVPN-v1.74.apk release-artifacts/PhoenixVPN-v1.74-checksum.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: tugyix05/Phoenix-VPN
